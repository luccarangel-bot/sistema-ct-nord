<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Sistema de gestão do CT NORD.">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/icone.png" type="image/png">
<link rel="apple-touch-icon" href="/icone-apple.png">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Gestão do CT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: barra lateral preta (Preto Tatame) com o logo branco + área de trabalho em Branco Kimono; tudo em linhas de 1px, cantos retos, sem cor de destaque. Ênfase por peso, tamanho e inversão preto/branco. */
:root {
  --bg: #F3F3F1; --surface: #FFFFFF; --surface-2: #EAEAE7; --line: #D6D6D2; --line-strong: #0B0B0B;
  --fg: #0B0B0B; --muted: #5C5C59; --cinza: #9A9A96; --inv-bg: #0B0B0B; --inv-fg: #F3F3F1;
  --side-bg: #0B0B0B; --side-fg: #F3F3F1; --side-muted: #A3A3A0; --side-line: #262624;
  --veu: rgba(11, 11, 11, .72);
  /* tokens antigos, mapeados para o preto e branco da marca */
  --accent: var(--fg); --accent-fg: var(--inv-fg); --accent-soft: var(--surface-2);
  --ok: var(--fg); --bad: var(--fg); --warn: var(--fg); --ok-soft: var(--surface-2); --bad-soft: var(--surface-2); --warn-soft: var(--surface-2);
  --f-marca: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0B0B; --surface: #131313; --surface-2: #1C1C1C; --line: #2C2C2A; --line-strong: #F3F3F1;
  --fg: #F3F3F1; --muted: #A3A3A0; --cinza: #6E6E6A; --inv-bg: #F3F3F1; --inv-fg: #0B0B0B;
  --side-line: #2C2C2A; --veu: rgba(0, 0, 0, .8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B0B0B; --surface: #131313; --surface-2: #1C1C1C; --line: #2C2C2A; --line-strong: #F3F3F1;
  --fg: #F3F3F1; --muted: #A3A3A0; --cinza: #6E6E6A; --inv-bg: #F3F3F1; --inv-fg: #0B0B0B;
  --side-line: #2C2C2A; --veu: rgba(0, 0, 0, .8); color-scheme: dark; }

* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-stretch: 100%; font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; text-transform: uppercase; letter-spacing: -.02em; margin: 0; text-wrap: balance; line-height: 1; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.05rem; letter-spacing: -.01em; }
h3 { font-size: .9rem; }
a { color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.rotulo, .sobre { font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; }

/* Estrutura */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-fg); border-right: 1px solid var(--side-line); padding: 24px 0 16px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.marca { padding: 0 22px 26px; border-bottom: 1px solid var(--side-line); margin-bottom: 10px; }
.marca img { width: 128px; height: auto; display: block; }
.marca small { display: block; margin-top: 14px; color: var(--side-muted); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .62rem; }
.nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 22px; cursor: pointer; color: var(--side-muted); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; }
.nav-btn svg { width: 18px; height: 18px; flex: none; stroke-width: 1.6; }
.nav-btn:hover { color: var(--side-fg); }
.nav-btn[aria-current="page"] { background: var(--side-fg); color: var(--side-bg); }
.side .espaco { flex: 1; }
.modo { font-size: .72rem; color: var(--side-muted); padding: 12px 22px 0; border-top: 1px solid var(--side-line); }
.barra-celular { display: none; }

main { padding-inline: 36px; padding-block: 32px 56px; min-width: 0; }
.topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line-strong); }
.topo > div:first-child { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.topo .sobre { color: var(--fg); }
.topo p { margin: 0; color: var(--muted); max-width: 62ch; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--fg); background: transparent; color: var(--fg); padding: 11px 18px; cursor: pointer; white-space: nowrap; text-decoration: none; font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; font-size: .7rem; line-height: 1.2; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.btn.pri:hover { background: var(--inv-bg); opacity: .86; }
.topo .btn.pri::after, .rodape .btn.pri::after { content: "→"; font-stretch: 100%; letter-spacing: 0; font-size: .9rem; }
.btn.peq { padding: 7px 11px; font-size: .64rem; gap: 6px; }
.btn.link { border: 0; border-bottom: 1px solid var(--fg); padding: 2px 0; background: none; }
.btn.link:hover { background: none; opacity: .7; }
.btn.perigo { border-style: dashed; }
.btn.link.perigo { border-bottom-style: dashed; }
.btn:disabled { opacity: .4; cursor: default; }

.aviso { border: 1px solid var(--line-strong); background: var(--surface); padding: 12px 16px; margin-bottom: 20px; color: var(--fg); font-size: .9rem; }
.aviso.demo, .aviso.forte { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }

/* Números de resumo: células separadas por filete */
.kpis { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin-bottom: 28px; }
.kpi { flex: 1 1 190px; background: var(--surface); padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.kpi span { color: var(--muted); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .64rem; }
.kpi b { font-stretch: 125%; font-size: clamp(1.3rem, 1rem + 1vw, 1.75rem); font-weight: 800; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: .8rem; }
.kpi.bad { background: var(--inv-bg); }
.kpi.bad span, .kpi.bad small { color: var(--inv-fg); opacity: .75; }
.kpi.bad b { color: var(--inv-fg); }

/* Painéis */
.notif { border-color: var(--line-strong); }
.notif > header h2::before { content: "● "; font-size: .8em; vertical-align: .1em; }
.grade2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 20px; }
.painel { background: var(--surface); border: 1px solid var(--line); padding: 18px 20px; min-width: 0; }
.painel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line-strong); }
.painel > header small { color: var(--muted); font-size: .8rem; }
.vazio { color: var(--muted); padding: 12px 0; font-size: .9rem; }

.lista { list-style: none; margin: 0; padding: 0; }
.lista li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.lista li:first-child { border-top: 0; }
.lista .cresce { flex: 1; min-width: 160px; }
.lista .cresce b { display: block; font-weight: 700; }
.lista .cresce small { color: var(--muted); }

/* Abas, filtros e seleção */
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 12px 0; color: var(--muted); cursor: pointer; border-bottom: 1px solid transparent; margin-bottom: -1px; white-space: nowrap; font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }

.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filtros input[type="search"] { flex: 1 1 240px; }
.chip { border: 1px solid var(--fg); background: transparent; padding: 8px 12px; cursor: pointer; color: var(--fg); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; font-size: .64rem; }
.chip[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.chip .cont { opacity: .6; margin-left: 6px; }

input, select, textarea { background: var(--surface); border: 1px solid var(--line-strong); padding: 10px 12px; width: 100%; min-width: 0; font-size: .92rem; }
input::placeholder, textarea::placeholder { color: var(--cinza); }
textarea { min-height: 76px; resize: vertical; }
.filtros select, .filtros input { width: auto; }

/* Tabelas */
.tabela-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .62rem; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.dir, th.dir { text-align: right; }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: var(--surface-2); }
td small { color: var(--muted); display: block; font-size: .8rem; }

/* Etiquetas de situação: sem cor, por forma e inversão */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .6rem; line-height: 1.2; }
.pill.ok { border-color: var(--line); color: var(--muted); }
.pill.ok::before { content: "✓"; letter-spacing: 0; }
.pill.warn { border-color: var(--fg); color: var(--fg); }
.pill.bad { background: var(--inv-bg); border-color: var(--inv-bg); color: var(--inv-fg); }
.pill.info { border: 1px dashed var(--fg); color: var(--fg); }

.faixa { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.faixa svg { flex: none; }
.faixa-cinto { stroke: var(--line-strong); }

/* Perfil */
.perfil-topo { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line-strong); }
.avatar { width: 64px; height: 64px; background: var(--inv-bg); color: var(--inv-fg); display: grid; place-items: center; font-stretch: 125%; font-size: 1.4rem; font-weight: 800; flex: none; letter-spacing: -.02em; }
.perfil-topo .cresce { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 10px; }
.perfil-topo p { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.dados { display: grid; grid-template-columns: max-content 1fr; gap: 0; font-size: .9rem; margin: 10px 0 0; }
.dados dt, .dados dd { padding: 9px 0; border-top: 1px solid var(--line); }
.dados dt { color: var(--muted); padding-right: 18px; font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .62rem; padding-top: 12px; }
.dados dt:first-of-type, .dados dt:first-of-type + dd { border-top: 0; }
.dados dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.voltar { margin-bottom: 18px; }

/* Funil */
.funil-wrap { overflow-x: auto; padding-bottom: 6px; }
.funil { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(248px, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); min-width: min-content; }
.coluna { background: var(--surface-2); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; }
.coluna > header { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 10px; border-bottom: 1px solid var(--line-strong); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; font-size: .68rem; }
.coluna > header span { font-variant-numeric: tabular-nums; }
.card-lead { background: var(--surface); border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.card-lead b { font-weight: 700; }
.card-lead small { color: var(--muted); }
.card-lead .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 4px; }
.card-lead select { padding: 6px 8px; font-size: .82rem; }

/* Agenda */
.semana-wrap { overflow-x: auto; padding-bottom: 6px; }
.semana { display: grid; grid-template-columns: repeat(7, minmax(158px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); min-width: min-content; }
.dia { display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--bg); padding: 0 8px 10px; }
.dia > header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px; margin: 0 -8px; padding-inline: 10px; border-bottom: 1px solid var(--line-strong); }
.dia > header b { font-stretch: 125%; font-weight: 800; text-transform: uppercase; font-size: .82rem; letter-spacing: -.01em; }
.dia > header span { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.dia.hoje > header { background: var(--inv-bg); border-bottom-color: var(--inv-bg); }
.dia.hoje > header b, .dia.hoje > header span { color: var(--inv-fg); }
.aula { background: var(--surface); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: .84rem; }
.aula .hora { font-stretch: 125%; font-weight: 800; font-size: .95rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.aula small { color: var(--muted); }
.aula .mod { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .6rem; }
.aula .mod i { width: 8px; height: 8px; flex: none; border: 1px solid var(--fg); }
.aula .mod i.m-jj { background: var(--fg); }
.aula .mod i.m-kids { background: transparent; }
.aula .mod i.m-mt { background: linear-gradient(135deg, var(--fg) 50%, transparent 50%); }
.aula.feita { background: var(--surface-2); }
.semana-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.semana-nav b { font-stretch: 125%; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; font-size: .95rem; min-width: 220px; text-align: center; }
.chamada-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); max-height: 46vh; overflow: auto; }
.chamada-lista li label { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; flex-wrap: wrap; }
.chamada-lista li:first-child label { border-top: 0; }
.chamada-lista li label:has(input:checked) { background: var(--surface-2); }
.chamada-lista input[type="checkbox"] { width: 20px; height: 20px; flex: none; accent-color: var(--fg); }
.chamada-lista .cresce { flex: 1; min-width: 140px; }
.dias-sel { display: flex; gap: 6px; flex-wrap: wrap; }
.dias-sel label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--fg); padding: 7px 10px; cursor: pointer; font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .64rem; }
.dias-sel input { width: auto; margin: 0; accent-color: var(--inv-fg); }
.dias-sel label:has(input:checked) { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.copiavel { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.copiavel input { flex: 1 1 260px; font-size: .8rem; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

/* Gráfico */
.grafico { width: 100%; height: auto; display: block; }
.grafico text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.grafico .eixo { stroke: var(--line); }
.legenda { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); margin-top: 8px; font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .6rem; }
.legenda i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }

/* DRE */
.dre td { padding: 9px 14px; }
.dre tr.grupo td { font-weight: 700; background: var(--surface-2); font-stretch: 112.5%; text-transform: uppercase; letter-spacing: .06em; font-size: .72rem; }
.dre tr.res td { font-stretch: 125%; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; font-size: .92rem; border-bottom: 1px solid var(--line-strong); }
.dre td.sub { padding-left: 30px; color: var(--muted); }

/* Modal */
.fundo { position: fixed; inset: 0; background: var(--veu); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border: 1px solid var(--line-strong); width: min(580px, 100%); max-height: calc(100% - 32px); overflow: auto; }
.modal > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal form, .modal .corpo { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 16px; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo > span, .campo > .rotulo { font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .62rem; }
.campo > small { color: var(--muted); font-size: .8rem; }
.linha2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; }
.check input { width: auto; margin-top: 4px; accent-color: var(--fg); }
.rodape { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.form-secao { border-top: 1px solid var(--line-strong); padding-top: 16px; margin-top: 4px; display: flex; flex-direction: column; gap: 4px; }
.form-secao small { color: var(--muted); font-size: .82rem; }
.venda-detalhes { display: flex; flex-direction: column; gap: 16px; }
.venda-detalhes[hidden] { display: none; }
.resumo { background: var(--surface-2); border-left: 1px solid var(--line-strong); padding: 12px 14px; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.resumo b { font-variant-numeric: tabular-nums; }
.fechar { background: none; border: 1px solid transparent; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--fg); padding: 2px 8px; }
.fechar:hover { border-color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--inv-bg); color: var(--inv-fg); padding: 12px 18px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); font-size: .9rem; }

.boas-vindas { background: var(--surface); border: 1px solid var(--line); padding: 28px; max-width: 720px; }
.boas-vindas ol { padding-left: 20px; margin: 14px 0 22px; display: flex; flex-direction: column; gap: 8px; }
.carregando { padding: 40px 0; color: var(--muted); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; }
.wa { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--fg); font-stretch: 112.5%; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; font-size: .64rem; padding-bottom: 1px; white-space: nowrap; }
.wa::after { content: " →"; letter-spacing: 0; }
.wa:hover { opacity: .7; }
.so-celular { display: none; }
.neg { font-weight: 800; }
.saida { color: var(--muted); }


/* Login */
.login { position: fixed; inset: 0; overflow: auto; background: #0B0B0B; color: #F3F3F1; display: grid; place-items: center; padding-block: 32px; padding-inline: 16px; z-index: 30; }

<script>
"use strict";
/* ================= Constantes ================= */
const MODALIDADES = ['Jiu-jitsu', 'Jiu-jitsu Kids', 'Muay Thai'];
const GRAD_PADRAO = {
  'Jiu-jitsu': { faixas: ['Branca', 'Azul', 'Roxa', 'Marrom', 'Preta'], graus: 4 },
  'Jiu-jitsu Kids': { faixas: ['Branca', 'Cinza e branca', 'Cinza', 'Cinza e preta', 'Amarela e branca', 'Amarela', 'Amarela e preta', 'Laranja e branca', 'Laranja', 'Laranja e preta', 'Verde e branca', 'Verde', 'Verde e preta'], graus: 4 },
  'Muay Thai': { faixas: ['Branco', 'Vermelho e Branco', 'Vermelho', 'Vermelho e Azul Claro', 'Azul Claro', 'Azul Claro e Azul Escuro', 'Azul Escuro', 'Azul Escuro e Preto', 'Preto'], graus: 0 },
};
// Lista antiga do Muay Thai: se ainda estiver salva em Ajustes sem alteração, vale a nova.
const MT_ANTIGA = ['Branco', 'Amarelo', 'Laranja', 'Verde', 'Azul', 'Roxo', 'Marrom', 'Preto'];
const FORMAS = ['Pix', 'Dinheiro', 'Cartão de débito', 'Cartão de crédito', 'Débito automático', 'Boleto', 'Transferência', 'TotalPass', 'Wellhub (Gympass)'];
const CAT_RECEITA = ['Mensalidades', 'Matrículas', 'Produtos', 'Aulas avulsas', 'Wellhub / TotalPass', 'Outras receitas'];
const CAT_DESPESA = {
  'Custos diretos': ['Professores', 'Materiais e equipamentos', 'Produtos para revenda'],
  'Despesas operacionais': ['Aluguel', 'Água, luz e internet', 'Marketing', 'Sistemas e taxas', 'Manutenção e limpeza', 'Salários e encargos', 'Outras despesas'],
  'Impostos': ['Impostos'],
};
const ETAPAS = [
  ['novo', 'Novo contato'], ['contato', 'Em conversa'], ['experimental', 'Aula experimental'],
  ['negociacao', 'Negociação'], ['matriculado', 'Matriculado'], ['perdido', 'Perdido'],
];
const ORIGENS = ['Instagram', 'Indicação', 'Google', 'WhatsApp', 'Passou na frente', 'Wellhub / TotalPass', 'Outro'];
const COLS = ['alunos', 'planos', 'contratos', 'lancamentos', 'leads', 'tarefas', 'turmas', 'aulas'];
const FICHA_URL = location.origin + '/ficha';
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const DIAS_L = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const COR_MOD = { 'Jiu-jitsu': 'var(--accent)', 'Jiu-jitsu Kids': 'var(--warn)', 'Muay Thai': 'var(--bad)' };
function b64e(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(t) {
  let b = t.replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
  const bin = atob(b); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(u));
}

/* ================= Datas e formatação ================= */
const pad = (n) => String(n).padStart(2, '0');
const isoDe = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const HOJE = isoDe(new Date());
const addDias = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoDe(d); };
const addMeses = (s, n) => {
  const [y, m, dd] = s.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1, 12);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(dd, ult)); return isoDe(t);
};
const comDia = (s, dia) => { const [y, m] = s.split('-').map(Number); const ult = new Date(y, m, 0).getDate(); return s.slice(0, 8) + pad(Math.min(dia, ult)); };
const difDias = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const mesDe = (s) => (s || '').slice(0, 7);
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESES_L = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const nomeMes = (k, longo) => { const [y, m] = k.split('-').map(Number); return (longo ? MESES_L : MESES)[m - 1] + (longo ? ' de ' : '/') + (longo ? y : String(y).slice(2)); };
const fData = (s) => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const fDataC = (s) => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '—';
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fR = (v) => BRL.format(Number(v) || 0);
const num = (v) => { if (v === '' || v == null) return 0; const n = Number(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const numCampo = (v) => { const s = String(v ?? '').trim(); if (!s) return 0; if (s.includes(',')) return num(s); const n = Number(s); return isFinite(n) ? n : 0; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const novoId = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iniciais = (n) => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join('').toUpperCase();
const idade = (nasc) => { if (!nasc) return null; const h = parseD(HOJE), n = parseD(nasc); let i = h.getFullYear() - n.getFullYear(); if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) i--; return i; };
const linkWa = (tel, msg) => {
  let d = String(tel || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + (msg ? '?text=' + encodeURIComponent(msg) : '');
};

/* ================= Estado ================= */
const S = { alunos: [], planos: [], contratos: [], lancamentos: [], leads: [], tarefas: [], turmas: [], aulas: [], fichas: [], config: null };
const UI = {
  view: 'inicio', alunoId: null,
  busca: '', filtroAluno: 'ativos',
  tabContratos: 'contratos', filtroContrato: 'ativos',
  tabFin: 'lancamentos', finTipo: 'receita', finMes: mesDe(HOJE), finStatus: 'todos', dreMes: mesDe(HOJE),
  tabCrm: 'funil', tabAgenda: 'semana', semana: 0,
};
let DB = null, MODO = 'carregando', somenteLeitura = false, USUARIO = null, EQUIPE = null, revLocal = 0;
const carregadas = new Set();

/* ================= Regras de negócio ================= */
function grads() {
  const c = (S.config && S.config.graduacoes) || {};
  const r = {};
  for (const m of MODALIDADES) r[m] = c[m] && c[m].faixas && c[m].faixas.length ? c[m] : GRAD_PADRAO[m];
  if (r['Muay Thai'].faixas.join('|') === MT_ANTIGA.join('|')) r['Muay Thai'] = GRAD_PADRAO['Muay Thai'];
  return r;
}
const pagoDe = (l) => (l.pagamentos || []).reduce((s, p) => s + (Number(p.valor) || 0), 0);
const devidoDe = (l) => Math.max(0, (Number(l.valor) || 0) - (Number(l.desconto) || 0));
const saldoDe = (l) => Math.max(0, Math.round((devidoDe(l) - pagoDe(l)) * 100) / 100);
function statusLanc(l) {
  if (l.cancelado) return 'cancelado';
  if (saldoDe(l) <= 0.004) return 'pago';
  if (l.vencimento < HOJE) return 'atrasado';
  if (pagoDe(l) > 0) return 'parcial';
  return 'aberto';
}
function statusContrato(c) {
  if (c.cancelado) return 'cancelado';
  if (c.fim < HOJE) return 'vencido';
  if (c.inicio > HOJE) return 'futuro';
  if (difDias(HOJE, c.fim) <= 30) return 'avencer';
  return 'ativo';
}
const contratosDo = (alunoId) => S.contratos.filter((c) => c.alunoId === alunoId).sort((a, b) => b.inicio.localeCompare(a.inicio));
const contratoVigente = (alunoId) => contratosDo(alunoId).find((c) => ['ativo', 'avencer', 'futuro'].includes(statusContrato(c)));
const alunoAtivo = (a) => !!contratoVigente(a.id);
const lancsDo = (alunoId) => S.lancamentos.filter((l) => l.alunoId === alunoId && !l.cancelado);
const dividaDo = (alunoId) => lancsDo(alunoId).filter((l) => l.tipo === 'receita' && statusLanc(l) === 'atrasado').reduce((s, l) => s + saldoDe(l), 0);
const alunoPorId = (id) => S.alunos.find((a) => a.id === id);
const planoPorId = (id) => S.planos.find((p) => p.id === id);
const leadPorId = (id) => S.leads.find((l) => l.id === id);
const nomeAluno = (id) => (alunoPorId(id) || {}).nome || 'Aluno removido';
/* Frequência */
const turmaPorId = (id) => S.turmas.find((t) => t.id === id);
const aulaId = (turmaId, data) => 'au_' + turmaId + '_' + data;
const diaSemana = (iso) => parseD(iso).getDay();
const turmasDoDia = (iso) => S.turmas.filter((t) => t.ativa !== false && (t.dias || []).includes(diaSemana(iso))).sort((a, b) => a.inicio.localeCompare(b.inicio));
function presencasDo(alunoId) {
  return S.aulas.filter((a) => (a.presentes || []).includes(alunoId)).sort((x, y) => y.data.localeCompare(x.data));
}
const ultimoTreino = (alunoId) => { const p = presencasDo(alunoId)[0]; return p ? p.data : ''; };
function aulasDesdeGrad(a, mod) {
  const datas = (a.historicoGrad || []).filter((g) => g.mod === mod).map((g) => g.data).sort();
  const m = (a.modalidades || []).find((x) => x.mod === mod);
  const desde = datas.length ? datas[datas.length - 1] : (m ? m.desde : '');
  return presencasDo(a.id).filter((p) => p.data >= (desde || '') && (p.modalidade || (turmaPorId(p.turmaId) || {}).modalidade) === mod).length;
}
function situacaoAcesso(alunoId) {
  const vig = contratoVigente(alunoId);
  if (!vig) { const ult = contratosDo(alunoId)[0]; return ult ? ['bad', 'Contrato vencido'] : ['bad', 'Sem contrato']; }
  if (statusContrato(vig) === 'futuro') return ['warn', 'Contrato ainda não começou'];
  if (dividaDo(alunoId) > 0) return ['bad', 'Em atraso'];
  return null;
}
function grupoDespesa(cat) { for (const g in CAT_DESPESA) if (CAT_DESPESA[g].includes(cat)) return g; return 'Despesas operacionais'; }

function pagamentosNoMes(mes, tipo) {
  const r = [];
  for (const l of S.lancamentos) {
    if (l.cancelado || (tipo && l.tipo !== tipo)) continue;
    for (const p of l.pagamentos || []) if (mesDe(p.data) === mes) r.push({ l, p });
  }
  return r;
}

/* Gera as cobranças de um contrato */
function gerarCobrancas(c, opts) {
  const n = c.forma === 'app' ? 0 : c.forma === 'avista' ? 1 : c.meses;
  const r = [];
  for (let i = 0; i < n; i++) {
    let venc;
    if (c.forma === 'avista') venc = c.inicio;
    else if (c.forma === 'cartao') venc = addMeses(c.inicio, i);
    else venc = i === 0 && opts.primeiraNoInicio ? c.inicio : comDia(addMeses(c.inicio, i), c.diaVenc);
    const valor = c.forma === 'avista' ? c.valorMensal * c.meses : c.valorMensal;
    const desconto = c.forma === 'avista' ? c.desconto * c.meses : c.desconto;
    const l = {
      id: novoId('lc'), tipo: 'receita', categoria: 'Mensalidades',
      descricao: c.planoNome + (n > 1 ? ' · parcela ' + (i + 1) + '/' + n : ' · pagamento à vista'),
      valor, desconto, vencimento: venc, pagamentos: [], alunoId: c.alunoId, contratoId: c.id, cancelado: false,
      formaPrevista: c.forma === 'cartao' ? 'Cartão de crédito' : (opts.forma || 'Pix'), criadoEm: new Date().toISOString(),
    };
    if (opts.retroativo && venc < HOJE) l.pagamentos.push({ data: venc, valor: Math.max(0, valor - desconto), forma: l.formaPrevista });
    r.push(l);
  }
  if (opts.matricula > 0) {
    r.push({
      id: novoId('lc'), tipo: 'receita', categoria: 'Matrículas', descricao: 'Taxa de matrícula', valor: opts.matricula, desconto: 0,
      vencimento: c.inicio, pagamentos: opts.retroativo && c.inicio < HOJE ? [{ data: c.inicio, valor: opts.matricula, forma: opts.forma || 'Pix' }] : [],
      alunoId: c.alunoId, contratoId: c.id, cancelado: false, formaPrevista: opts.forma || 'Pix', criadoEm: new Date().toISOString(),
    });
  }
  return r;
}

/* ================= Persistência (API do site) ================= */
const API = {
  async req(metodo, url, dados) {
    let r;
    try {
      r = await fetch(url, { method: metodo, credentials: 'same-origin', headers: dados ? { 'Content-Type': 'application/json' } : {}, body: dados ? JSON.stringify(dados) : undefined });
    } catch (_) { throw { code: 'rede', message: 'Sem conexão com o servidor. Confira a internet e tente de novo.' }; }
    let j = {};
    try { j = await r.json(); } catch (_) {}

function mesesDisponiveis() {
  const set = new Set([mesDe(HOJE)]);
  S.lancamentos.forEach((l) => { set.add(mesDe(l.vencimento)); (l.pagamentos || []).forEach((p) => set.add(mesDe(p.data))); });
  return [...set].filter(Boolean).sort().reverse();
}
function finContas() {
  const meses = mesesDisponiveis();
  let lista = S.lancamentos.filter((l) => l.tipo === UI.finTipo && !l.cancelado);
  if (UI.finStatus === 'atrasado') lista = lista.filter((l) => statusLanc(l) === 'atrasado');
  else {
    lista = lista.filter((l) => mesDe(l.vencimento) === UI.finMes);
    if (UI.finStatus === 'pendente') lista = lista.filter((l) => ['aberto', 'parcial', 'atrasado'].includes(statusLanc(l)));
    if (UI.finStatus === 'pago') lista = lista.filter((l) => statusLanc(l) === 'pago');
  }
  lista.sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const tot = lista.reduce((s, l) => s + devidoDe(l), 0), pg = lista.reduce((s, l) => s + pagoDe(l), 0);
  let h = '<div class="filtros">' + chip('finTipo', 'receita', 'A receber') + chip('finTipo', 'despesa', 'A pagar') +
    '<select id="fin-mes" data-ui="finMes" aria-label="Mês"' + (UI.finStatus === 'atrasado' ? ' disabled' : '') + '>' + meses.map((m) => opt(m, nomeMes(m, true), m === UI.finMes)).join('') + '</select>' +
    chip('finStatus', 'todos', 'Todas') + chip('finStatus', 'pendente', 'Pendentes') + chip('finStatus', 'pago', 'Pagas') + chip('finStatus', 'atrasado', 'Todas as atrasadas') + '</div>';
  h += '<div class="kpis"><div class="kpi"><span>Total ' + (UI.finTipo === 'receita' ? 'a receber' : 'a pagar') + '</span><b>' + fR(tot) + '</b><small>' + lista.length + ' conta(s)</small></div>' +
    '<div class="kpi"><span>Já ' + (UI.finTipo === 'receita' ? 'recebido' : 'pago') + '</span><b>' + fR(pg) + '</b></div>' +
    '<div class="kpi"><span>Falta</span><b>' + fR(Math.max(0, tot - pg)) + '</b></div></div>';
  return h + tabelaLancamentos(lista, { vazio: 'Nenhuma conta neste filtro.' });

function finCaixa() {

    const entR = pagamentosNoMes(m, 'receita').reduce((s, x) => s + x.p.valor, 0);
    const saiR = pagamentosNoMes(m, 'despesa').reduce((s, x) => s + x.p.valor, 0);
    const prev = (t) => S.lancamentos.filter((l) => l.tipo === t && !l.cancelado && mesDe(l.vencimento) === m && ['aberto', 'parcial'].includes(statusLanc(l))).reduce((s, l) => s + saldoDe(l), 0);
    return { m, entR, saiR, entP: prev('receita'), saiP: prev('despesa') };
  });
  const atrasoRec = S.lancamentos.filter((l) => l.tipo === 'receita' && statusLanc(l) === 'atrasado').reduce((s, l) => s + saldoDe(l), 0);
  const atrasoPag = S.lancamentos.filter((l) => l.tipo === 'despesa' && statusLanc(l) === 'atrasado').reduce((s, l) => s + saldoDe(l), 0);
  // Gráfico
  const W = 640, H = 230, L = 58, B = 26, T = 10;
  const maxV = Math.max(1, ...dados.map((d) => Math.max(d.entR + d.entP, d.saiR + d.saiP)));
  const passo = niceStep(maxV / 4); const topo = Math.ceil(maxV / passo) * passo;
  const y = (v) => T + (H - T - B) * (1 - v / topo);
  const gw = (W - L - 10) / dados.length, bw = Math.min(26, gw / 3.2);
  let svg = '<svg class="grafico" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Entradas e saídas por mês">';
  for (let v = 0; v <= topo + 0.01; v += passo) svg += '<line class="eixo" x1="' + L + '" x2="' + (W - 6) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fCurto(v) + '</text>';
  dados.forEach((d, i) => {
    const cx = L + gw * i + gw / 2;
    const barra = (x, real, prev, cor) => {
      let s = '';
      if (real > 0) s += '<rect x="' + x + '" y="' + y(real) + '" width="' + bw + '" height="' + (y(0) - y(real)) + '" fill="' + cor + '"/>';
      if (prev > 0) s += '<rect x="' + x + '" y="' + y(real + prev) + '" width="' + bw + '" height="' + (y(real) - y(real + prev)) + '" fill="none" stroke="' + cor + '" stroke-dasharray="3 2"/>';
      return s;
    };
    svg += barra(cx - bw - 2, d.entR, d.entP, 'var(--fg)') + barra(cx + 2, d.saiR, d.saiP, 'var(--cinza)');
    svg += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle"' + (d.m === mesDe(HOJE) ? ' style="font-weight:700;fill:var(--fg)"' : '') + '>' + nomeMes(d.m) + '</text>';
  });
  svg += '</svg>';
  let h = '<div class="grade2"><section class="painel" style="grid-column:1/-1"><header><h2>Fluxo de caixa</h2><small>3 meses anteriores e previsão para os próximos 2</small></header>' + svg +
    '<div class="legenda"><span><i style="background:var(--fg)"></i>Entradas realizadas</span><span><i style="border:1px dashed var(--fg)"></i>Entradas previstas</span><span><i style="background:var(--cinza)"></i>Saídas realizadas</span><span><i style="border:1px dashed var(--cinza)"></i>Saídas previstas</span></div>';
  let acum = 0;
  h += '<div class="tabela-wrap" style="margin-top:12px"><table><thead><tr><th>Mês</th><th class="dir">Entrou</th><th class="dir">Saiu</th><th class="dir">Saldo realizado</th><th class="dir">Ainda vai entrar</th><th class="dir">Ainda vai sair</th><th class="dir">Saldo previsto</th></tr></thead><tbody>' +
    dados.map((d) => { const sr = d.entR - d.saiR, sp = sr + d.entP - d.saiP; acum += sp; return '<tr><td>' + nomeMes(d.m, true) + '</td><td class="dir num">' + fR(d.entR) + '</td><td class="dir num">' + fR(d.saiR) + '</td><td class="dir num' + (sr < 0 ? ' neg' : '') + '">' + (sr < 0 ? '−' : '') + fR(Math.abs(sr)) + '</td><td class="dir num">' + fR(d.entP) + '</td><td class="dir num">' + fR(d.saiP) + '</td><td class="dir num"><b>' + (sp < 0 ? '−' : '') + fR(Math.abs(sp)) + '</b></td></tr>'; }).join('') +
    '</tbody></table></div><p class="vazio">Fora da previsão: ' + fR(atrasoRec) + ' em mensalidades atrasadas a receber e ' + fR(atrasoPag) + ' em contas atrasadas a pagar.</p></section>';

  const porForma = {};

  h += '<section class="painel"><header><h2>Caixa de hoje</h2><small>' + fData(HOJE) + '</small></header>' +
    (movs.length ? '<ul class="lista">' + movs.map(({ l, p }) => '<li><div class="cresce"><b>' + esc(l.descricao) + '</b><small>' + esc(p.forma) + (l.alunoId ? ' · ' + esc(nomeAluno(l.alunoId)) : '') + '</small></div><span class="num' + (l.tipo === 'receita' ? ' neg' : ' saida') + '">' + (l.tipo === 'receita' ? '+' : '−') + fR(p.valor) + '</span></li>').join('') + '</ul>' : '<p class="vazio">Nenhum recebimento ou pagamento registrado hoje.</p>') + '</section>';
  h += '<section class="painel"><header><h2>Fechamento por forma de pagamento</h2></header>' +
    (Object.keys(porForma).length ? '<ul class="lista">' + Object.entries(porForma).map(([f, v]) => '<li><div class="cresce"><b>' + esc(f) + '</b></div><span class="num">' + fR(v) + '</span></li>').join('') +
      '<li><div class="cresce"><b>Total do dia</b></div><b class="num">' + fR(Object.values(porForma).reduce((s, v) => s + v, 0)) + '</b></li></ul>' : '<p class="vazio">O fechamento aparece aqui conforme os pagamentos do dia forem registrados.</p>') +
    '<p class="vazio">Antecipação de recebíveis do cartão depende da sua maquininha ou banco e não é feita por aqui.</p></section></div>';
  return h;
}
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function fCurto(v) { return v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : 'R$ ' + Math.round(v); }

  abrirModal(nova ? 'Adicionar modalidade' : 'Registrar graduação', '<form data-form="graduar"><input type="hidden" name="id" value="' + a.id + '"><input type="hidden" name="i" value="' + (nova ? -1 : i) + '">' +
    (nova ? campo('Modalidade', sel('gr-mod', 'mod', MODALIDADES.map((x) => opt(x, x, x === m.mod)).join(''), 'data-troca-mod')) : '<input type="hidden" name="mod" value="' + esc(m.mod) + '"><div class="resumo"><span>' + esc(a.nome) + ' · ' + esc(m.mod) + '</span><span>Atual: ' + faixaHtml(m) + '</span></div>') +
    '<div class="linha2">' + campo('Nova faixa', sel('al-faixa', 'faixa', g.faixas.map((f) => opt(f, f, f === faixaSug)).join(''))) + campo('Grau', inp('al-grau', 'grau', grauSug, 'type="number" min="0" max="10"')) + campo('Data', inp('gr-data', 'data', HOJE, 'type="date" required')) + '</div>' +
    rodape(nova ? 'Adicionar' : 'Salvar graduação') + '</form>');
}
function modalLead(l) {

    campo('Aluno', sel('tf-aluno', 'alunoId', '<option value="">Nenhum</option>' + S.alunos.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map((a) => opt(a.id, a.nome, a.id === t.alunoId)).join(''))) +
    rodape('Salvar') + '</form>' + (t.id ? '<div class="corpo" style="padding-top:0"><button class="btn perigo peq" data-act="excluir-tarefa" data-id="' + t.id + '" style="align-self:flex-start">Excluir tarefa</button></div>' : ''));
}

/* ================= Formulários ================= */
const FORMS = {
  async aluno(d) {
    const ex = d.id ? alunoPorId(d.id) : null;
    const a = ex ? { ...ex } : { id: novoId('al'), modalidades: [], historicoGrad: [], criadoEm: new Date().toISOString() };
    // Cadastro novo com plano escolhido: confere a venda antes de gravar qualquer coisa.
    const v = !ex && d.planoId ? montarVenda(d, a.id) : null;
    if (!ex && d.planoId && !v) return;
    Object.assign(a, {
      nome: d.nome.trim(), telefone: d.telefone.trim(), email: d.email.trim(), nascimento: d.nascimento, responsavel: d.responsavel.trim(), obs: d.obs.trim(),
      cpf: d.cpf.trim(), endereco: d.endereco.trim(), respTelefone: d.respTelefone.trim(), emergencia: d.emergencia.trim(), origem: d.origem, saude: d.saude.trim(),
    });
    if (!ex) {
      const m = { mod: d.mod, faixa: d.faixa, grau: Number(d.grau) || 0, desde: HOJE };
      a.modalidades = [m]; a.historicoGrad = [{ data: HOJE, mod: m.mod, faixa: m.faixa, grau: m.grau }];
    }
    fecharModal();
    await salvar('alunos', a);
    if (d.leadId) { const l = leadPorId(d.leadId); if (l) await salvar('leads', { ...l, etapa: 'matriculado', alunoId: a.id }); }
    if (v && (await gravarVenda(v))) toast('Aluno cadastrado e venda registrada: ' + txtCobr(v) + '.');
    else toast(ex ? 'Dados atualizados.' : 'Aluno cadastrado.');
    if (!ex) { UI.view = 'aluno'; UI.alunoId = a.id; render(); if (d.leadId && !v) modalVenda({ alunoId: a.id }); }
  },
  async plano(d, f) {
    const valor = numCampo(d.valor); if (valor <= 0 && d.formaPadrao !== 'app') { toast('Informe um valor maior que zero.'); return; }
    const pagamentos = [...f.querySelectorAll('[name="aceita"]:checked')].map((x) => x.value);
    if (!pagamentos.length) { toast('Marque pelo menos uma forma de pagamento aceita.'); return; }
    const ex = d.id ? planoPorId(d.id) : null;
    const p = { ...(ex || { id: novoId('pl'), criadoEm: new Date().toISOString() }), nome: d.nome.trim(), modalidade: d.modalidade, valor, meses: Number(d.meses), formaPadrao: d.formaPadrao, pagamentos, condicoes: d.condicoes.trim(), ativo: !!d.ativo };
    fecharModal(); await salvar('planos', p); toast(ex ? 'Plano atualizado.' : 'Plano criado.');
  },
  async venda(d) {
    const v = montarVenda(d, d.alunoId); if (!v) return;
    fecharModal();
    if (!(await gravarVenda(v))) return;
    toast((v.c.renovacaoDe ? 'Contrato renovado' : 'Venda registrada') + ': ' + txtCobr(v) + '.');
    UI.view = 'aluno'; UI.alunoId = v.c.alunoId; render();
  },
  async baixa(d) {
    const l = S.lancamentos.find((x) => x.id === d.id); if (!l) return;
    const valor = numCampo(d.valor), desc = numCampo(d.desconto);
    if (valor < 0 || (valor === 0 && desc === 0)) { toast('Informe o valor pago ou um desconto.'); return; }
    const n = { ...l, pagamentos: [...(l.pagamentos || [])], desconto: (Number(l.desconto) || 0) + desc };
    if (valor > 0) n.pagamentos.push({ data: d.data, valor, forma: d.forma });
    fecharModal(); await salvar('lancamentos', n);
    const st = statusLanc(n);
    toast(st === 'pago' ? 'Baixa registrada. Conta quitada.' : 'Pagamento parcial registrado. Falta ' + fR(saldoDe(n)) + '.');
  },
  async lanc(d) {
    const valor = numCampo(d.valor); if (valor <= 0) { toast('Informe um valor maior que zero.'); return; }
    const n = Number(d.repetir) || 1; const lista = [];
    for (let i = 0; i < n; i++) {
      const venc = addMeses(d.vencimento, i);
      lista.push({
        id: novoId('lc'), tipo: d.tipo, categoria: d.categoria, descricao: d.descricao.trim() + (n > 1 ? ' · ' + (i + 1) + '/' + n : ''), valor, desconto: 0, vencimento: venc,
        pagamentos: d.pago ? [{ data: venc, valor, forma: d.forma }] : [], alunoId: d.alunoId || '', contratoId: '', cancelado: false, formaPrevista: d.forma, criadoEm: new Date().toISOString(),
      });
    }
    fecharModal(); await salvarVarios('lancamentos', lista); toast(n > 1 ? n + ' lançamentos criados.' : 'Lançamento salvo.');
  },
  async graduar(d) {
    const a = alunoPorId(d.id); if (!a) return;
    const n = { ...a, modalidades: (a.modalidades || []).map((m) => ({ ...m })), historicoGrad: [...(a.historicoGrad || [])] };
    const reg = { mod: d.mod, faixa: d.faixa, grau: Number(d.grau) || 0 };
    const i = Number(d.i);
    if (i < 0) {
      if (n.modalidades.some((m) => m.mod === d.mod)) { toast('O aluno já treina ' + d.mod + '.'); return; }
      n.modalidades.push({ ...reg, desde: d.data });
    } else n.modalidades[i] = { ...n.modalidades[i], ...reg };
    n.historicoGrad.push({ data: d.data, ...reg });
    fecharModal(); await salvar('alunos', n); toast('Graduação registrada.');
  },
  async lead(d) {
    const ex = d.id ? leadPorId(d.id) : null;
    let etapa = d.etapa;
    if (d.dataExperimental && (!ex || ex.dataExperimental !== d.dataExperimental) && ['novo', 'contato'].includes(etapa)) etapa = 'experimental';
    const l = { ...(ex || { id: novoId('ld'), alunoId: '', criadoEm: new Date().toISOString() }), nome: d.nome.trim(), telefone: d.telefone.trim(), interesse: d.interesse, origem: d.origem, etapa, dataExperimental: d.dataExperimental, obs: d.obs.trim() };
    fecharModal(); await salvar('leads', l); toast(ex ? 'Interessado atualizado.' : 'Interessado cadastrado.');
  },
  async tarefa(d) {
    const ex = d.id ? S.tarefas.find((t) => t.id === d.id) : null;
    const t = { ...(ex || { id: novoId('tf'), feita: false, criadoEm: new Date().toISOString() }), titulo: d.titulo.trim(), data: d.data, leadId: d.leadId, alunoId: d.alunoId };
    fecharModal(); await salvar('tarefas', t); toast('Tarefa salva.');
  },
  async dadosct(d) {
    await salvarConfig({ ...(S.config || {}), ct: { nome: d.nome.trim(), whatsapp: d.whatsapp.trim() } }); toast('Dados do CT salvos. O link da ficha foi atualizado.');
  },
  async turma(d, f) {
    const dias = [...f.querySelectorAll('[name="dia"]:checked')].map((x) => Number(x.value));
    if (!dias.length) { toast('Marque pelo menos um dia da semana.'); return; }
    if (d.fim <= d.inicio) { toast('O horário de término deve ser depois do início.'); return; }
    const ex = d.id ? turmaPorId(d.id) : null;
    const t = { ...(ex || { id: novoId('tu'), criadoEm: new Date().toISOString() }), nome: d.nome.trim(), modalidade: d.modalidade, dias, inicio: d.inicio, fim: d.fim, capacidade: Number(d.capacidade) || 0, professor: d.professor.trim(), ativa: !!d.ativa };
    fecharModal(); await salvar('turmas', t); toast(ex ? 'Turma atualizada.' : 'Turma criada.');
  },
  async chamada(d, f) {
    const presentes = [...f.querySelectorAll('[name="p"]:checked')].map((x) => x.value);
    const id = aulaId(d.turmaId, d.data);
    const ex = S.aulas.find((x) => x.id === id);
    fecharModal();
    if (!presentes.length && !ex) { toast('Nenhum aluno marcado. A chamada não foi salva.'); return; }
    const t = turmaPorId(d.turmaId) || {};
    await salvar('aulas', { ...(ex || { id, criadoEm: new Date().toISOString() }), turmaId: d.turmaId, turmaNome: t.nome || '', modalidade: t.modalidade || '', data: d.data, presentes, atualizadoEm: new Date().toISOString() });
    toast('Chamada salva: ' + presentes.length + ' presente(s).');
  },
  async checkin(d) {
    const t = turmaPorId(d.turmaId), a = alunoPorId(d.alunoId);
    if (!t || !a) { toast('Escolha o aluno e a turma.'); return; }
    if (d.data > HOJE) { toast('Não dá para registrar check-in em data futura.'); return; }
    const id = aulaId(t.id, d.data);
    const ex = S.aulas.find((x) => x.id === id);
    if (ex && (ex.presentes || []).includes(a.id)) { fecharModal(); toast(a.nome.split(' ')[0] + ' já está na chamada desta aula.'); return; }
    fecharModal();
    await salvar('aulas', { ...(ex || { id, turmaId: t.id, data: d.data, presentes: [], criadoEm: new Date().toISOString() }), turmaNome: t.nome, modalidade: t.modalidade, presentes: [...((ex && ex.presentes) || []), a.id], atualizadoEm: new Date().toISOString() });
    toast('Check-in registrado: ' + a.nome.split(' ')[0] + ' · ' + t.nome + '.');
  },
  importar(d) {
    const ficha = parseCodigo(d.txt);
    if (!ficha) { toast('Não encontrei a ficha nesta mensagem. Cole a mensagem inteira, incluindo o link.'); return; }
    fecharModal(); modalFicha(ficha);
  },
  async senha(d, f) {
    if (d.nova !== d.nova2) { toast('A nova senha e a repetição não são iguais.'); return; }
    if (String(d.nova).length < 10) { toast('A nova senha precisa ter pelo menos 10 caracteres.'); return; }
    try { await API.req('POST', '/api/usuarios', { acao: 'senha', atual: d.atual, nova: d.nova }); f.reset(); toast('Senha trocada.'); }
    catch (e) { tratarErro(e); }
  },
  async 'novo-usuario'(d) {
    try { const j = await API.req('POST', '/api/usuarios', { acao: 'criar', nome: d.nome, email: d.email, senha: d.senha, papel: d.papel }); fecharModal(); EQUIPE = null; render(); toast(j.usuario.nome + ' foi adicionado(a). Passe o e-mail e a senha para a pessoa.'); }
    catch (e) { tratarErro(e); }
  },
  async redefinir(d) {
    try { await API.req('POST', '/api/usuarios', { acao: 'redefinir', email: d.email, senha: d.senha }); fecharModal(); toast('Nova senha salva. Passe para a pessoa.'); }
    catch (e) { tratarErro(e); }
  },
  async graduacoes(d) {
    const g = {};
    for (const m of MODALIDADES) {
      const faixas = String(d['f_' + m] || '').split('\n').map((s) => s.trim()).filter(Boolean);
      g[m] = { faixas: faixas.length ? faixas : GRAD_PADRAO[m].faixas, graus: Math.max(0, Math.min(10, Number(d['g_' + m]) || 0)) };
    }
    await salvarConfig({ ...(S.config || {}), graduacoes: g }); toast('Graduações salvas.');
  },
};

  'descartar-ficha'(ds) {
    const f = S.fichas.find((x) => x.id === ds.id); if (!f) return;
    confirmar('Descartar ficha', 'Descartar a ficha de <b>' + esc(f.n) + '</b>? Ela sai da lista e os dados não são cadastrados.', 'Descartar', async () => { await remover('fichas', f.id); toast('Ficha descartada.'); });
  },
  'fechar-modal'() { fecharModal(); },
  fundo(ds, el, e) { if (e.target === el) fecharModal(); },
  async confirmar() { const fn = acaoConfirmar; acaoConfirmar = null; fecharModal(); if (fn) await fn(); },
  async 'carregar-exemplos'(ds, el) {
    const ex = window.gerarExemplos ? window.gerarExemplos(HOJE) : null; if (!ex) return;
    if (el) el.disabled = true; toast('Carregando exemplos…');
    for (const c of COLS) { for (const o of ex[c]) { const ok = await salvar(c, o); if (!ok) return; } }
    toast('Dados de exemplo carregados.');
  },
  'remover-exemplos'() {
    confirmar('Remover dados de exemplo', 'Remover todos os registros de exemplo? Os dados que você cadastrou continuam.', 'Remover exemplos', async () => {
      toast('Removendo exemplos…');
      for (const c of COLS) for (const o of S[c].filter((x) => x.exemplo)) await remover(c, o.id);
      UI.view = 'inicio'; toast('Exemplos removidos.');
    });
  },
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'A') return;
  const f = ACOES[t.dataset.act]; if (!f) return;
  if (t.dataset.act !== 'toggle-tarefa' && t.dataset.act !== 'fundo') e.preventDefault();
  if (t.dataset.act === 'abrir-aluno') e.stopPropagation();
  f(t.dataset, t, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  FORMS[f.dataset.form] && FORMS[f.dataset.form](d, f);
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.ui) { UI[el.dataset.ui] = el.value; render(); }
  if (el.closest && el.closest('[data-venda]')) atualizarResumoVenda();
  if (el.dataset && el.dataset.filtroChamada !== undefined) {
    const q = el.value.trim().toLowerCase();
    document.querySelectorAll('#ch-lista li[data-nome]').forEach((li) => { li.hidden = !!q && !li.dataset.nome.includes(q); });
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.addChamada !== undefined && el.value) {
    const a = alunoPorId(el.value); const ul = document.getElementById('ch-lista');
    if (a && ul) { const v = ul.querySelector('li.vazio'); if (v) v.remove(); ul.insertAdjacentHTML('beforeend', linhaChamada(a, el.dataset.addChamada, true)); el.querySelector('option[value="' + a.id + '"]').remove(); el.value = ''; }
  }
  if (el.closest && el.closest('form[data-form="chamada"]')) { const c = document.getElementById('ch-cont'); if (c) c.textContent = document.querySelectorAll('#ch-lista [name="p"]:checked').length; }
  if (el.dataset && el.dataset.ci !== undefined) avisoCheckin();
  if (el.dataset && el.dataset.etapa) {
    const l = leadPorId(el.dataset.etapa); if (!l) return;
    if (el.value === 'matriculado' && !l.alunoId) { el.value = l.etapa; ACOES['converter-lead']({ id: l.id }); return; }
    salvar('leads', { ...l, etapa: el.value }); toast('Etapa atualizada.');
  }
  if (el.dataset && el.dataset.trocaMod !== undefined) {
    const f = el.form.querySelector('[name="faixa"]'); if (f) f.innerHTML = grads()[el.value].faixas.map((x) => opt(x)).join('');
  }
  if (el.name === 'planoId' && el.closest && el.closest('[data-venda]')) {
    const p = planoPorId(el.value); const f = el.form.querySelector('[name="forma"]');
    if (p && p.formaPadrao && f) f.value = p.formaPadrao;
    const fp = el.form.querySelector('[name="formaPg"]');
    if (p && fp && p.pagamentos && p.pagamentos.length && !p.pagamentos.includes(fp.value)) fp.value = p.pagamentos[0];
  }
  if (el.closest && el.closest('[data-venda]')) atualizarResumoVenda();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalAberto) fecharModal(); });

/* ================= Início ================= */
document.getElementById('login-form').addEventListener('submit', entrar);
document.getElementById('login-ver').addEventListener('click', () => {
  verSenha(document.getElementById('login-senha').type === 'password');
  document.getElementById('login-senha').focus();
});
(async function iniciar() {
  render();
  try { await carregarTudo(); }
  catch (e) { if (e && e.code !== 401) mostrarLogin(e.message); }
})();
</script>
